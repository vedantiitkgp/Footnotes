<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!-- Road line hint -->
  <line x1="0" y1="93" x2="200" y2="93" stroke="#8a8070" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="97" x2="200" y2="97" stroke="#8a8070" stroke-width="1.5" opacity="0.3"/>
  <!-- Road dashes -->
  <rect x="20" y="94" width="18" height="2" rx="1" fill="#8a8070" opacity="0.2"/>
  <rect x="55" y="94" width="18" height="2" rx="1" fill="#8a8070" opacity="0.2"/>
  <rect x="90" y="94" width="18" height="2" rx="1" fill="#8a8070" opacity="0.2"/>
  <rect x="125" y="94" width="18" height="2" rx="1" fill="#8a8070" opacity="0.2"/>
  <rect x="160" y="94" width="18" height="2" rx="1" fill="#8a8070" opacity="0.2"/>
  <!-- Car body lower -->
  <rect x="18" y="64" width="165" height="26" rx="10" fill="#c9a84c" opacity="0.9"/>
  <!-- Car body upper (cabin) -->
  <path d="M52 64 Q58 36 78 32 L138 32 Q158 32 164 64 Z" fill="#d4a840" opacity="0.9"/>
  <!-- Windshield front -->
  <path d="M138 64 Q155 64 160 50 Q150 36 138 34 Z" fill="#0a1a2a" opacity="0.6"/>
  <path d="M138 64 Q155 64 160 50 Q150 36 138 34 Z" fill="#4af" opacity="0.2"/>
  <!-- Windshield rear -->
  <path d="M68 64 Q52 64 46 50 Q56 36 68 34 Z" fill="#0a1a2a" opacity="0.6"/>
  <path d="M68 64 Q52 64 46 50 Q56 36 68 34 Z" fill="#4af" opacity="0.15"/>
  <!-- Side windows -->
  <rect x="76" y="36" width="28" height="24" rx="4" fill="#0a1a2a" opacity="0.55"/>
  <rect x="76" y="36" width="28" height="24" rx="4" fill="#4af" opacity="0.18"/>
  <rect x="112" y="36" width="24" height="24" rx="4" fill="#0a1a2a" opacity="0.55"/>
  <rect x="112" y="36" width="24" height="24" rx="4" fill="#4af" opacity="0.18"/>
  <!-- Door lines -->
  <line x1="103" y1="64" x2="103" y2="75" stroke="#b08830" stroke-width="1.5" opacity="0.6"/>
  <line x1="140" y1="64" x2="140" y2="75" stroke="#b08830" stroke-width="1.5" opacity="0.6"/>
  <!-- Door handles -->
  <rect x="118" y="70" width="10" height="3" rx="1.5" fill="#8a6820" opacity="0.8"/>
  <rect x="80"  y="70" width="10" height="3" rx="1.5" fill="#8a6820" opacity="0.8"/>
  <!-- Headlight front -->
  <ellipse cx="180" cy="70" rx="9" ry="6" fill="#fff8d0" opacity="0.7"/>
  <ellipse cx="180" cy="70" rx="6" ry="4" fill="#fff" opacity="0.85"/>
  <!-- Taillight rear -->
  <ellipse cx="22" cy="70" rx="7" ry="5" fill="#c04040" opacity="0.6"/>
  <ellipse cx="22" cy="70" rx="4" ry="3" fill="#e05050" opacity="0.5"/>
  <!-- Front bumper -->
  <rect x="175" y="77" width="16" height="5" rx="2.5" fill="#b08830" opacity="0.8"/>
  <!-- Rear bumper -->
  <rect x="10" y="77" width="16" height="5" rx="2.5" fill="#b08830" opacity="0.8"/>
  <!-- Roof rack (subtle detail) -->
  <rect x="80" y="31" width="48" height="3" rx="1.5" fill="#b08830" opacity="0.5"/>
  <!-- Front wheel -->
  <circle cx="152" cy="88" r="14" fill="#3a3028" opacity="0.95"/>
  <circle cx="152" cy="88" r="9"  fill="#2a2018" opacity="0.95"/>
  <circle cx="152" cy="88" r="5"  fill="#c9a84c" opacity="0.6"/>
  <circle cx="152" cy="88" r="2"  fill="#e2c060" opacity="0.9"/>
  <!-- Rear wheel -->
  <circle cx="58"  cy="88" r="14" fill="#3a3028" opacity="0.95"/>
  <circle cx="58"  cy="88" r="9"  fill="#2a2018" opacity="0.95"/>
  <circle cx="58"  cy="88" r="5"  fill="#c9a84c" opacity="0.6"/>
  <circle cx="58"  cy="88" r="2"  fill="#e2c060" opacity="0.9"/>
  <!-- Exhaust puff -->
  <circle cx="8"  cy="76" r="5" fill="#f5f0e8" opacity="0.15"/>
  <circle cx="2"  cy="72" r="3" fill="#f5f0e8" opacity="0.1"/>
</svg>
