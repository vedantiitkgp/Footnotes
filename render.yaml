services:
  - type: web
    name: footnotes
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # Optional: enables "Import from Google Photos". Set the value in the
      # Render dashboard. Absent = the feature hides itself.
      - key: GOOGLE_PHOTOS_CLIENT_ID
        sync: false
